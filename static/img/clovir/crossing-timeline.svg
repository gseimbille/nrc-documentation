<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="Timeline: sound starts on entering the buffer zone, first stimulation at 3 seconds, second at 7 seconds, none after">
  <style>
    .ttl  { font: 600 13px system-ui, sans-serif; fill: #1f2937; }
    .lbl  { font: 600 12px system-ui, sans-serif; fill: #1f2937; }
    .note { font: 400 11px system-ui, sans-serif; fill: #4b5563; }
    .tick { font: 600 12px system-ui, sans-serif; fill: #4b5563; }
.note,.tick { fill: #9ca3af; }
    }
  </style>
  <rect x="0" y="0" width="560" height="190" fill="#ffffff" rx="6"/>
  <text class="ttl" x="10" y="20">Animal enters the buffer zone and stays</text>
  <!-- sound bar: continuous -->
  <rect x="70" y="46" width="450" height="20" rx="4" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.2"/>
  <text class="lbl" x="10" y="61">Sound</text>
  <text class="note" x="80" y="60">continuous while the animal remains — 100 dB @ 30 cm, 2731 Hz</text>
  <!-- axis -->
  <line x1="70" y1="110" x2="520" y2="110" stroke="#9ca3af" stroke-width="1.4"/>
  <text class="lbl" x="10" y="114">Stimulation</text>
  <!-- ticks -->
  <line x1="70" y1="104" x2="70" y2="116" stroke="#9ca3af" stroke-width="1.4"/>
  <text class="tick" x="62" y="132">0 s</text>
  <line x1="205" y1="98" x2="205" y2="122" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="205" cy="110" r="6" fill="#dc2626"/>
  <text class="tick" x="196" y="146">3 s</text>
  <text class="note" x="176" y="90">1st</text>
  <line x1="385" y1="98" x2="385" y2="122" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="385" cy="110" r="6" fill="#dc2626"/>
  <text class="tick" x="376" y="146">7 s</text>
  <text class="note" x="358" y="90">2nd</text>
  <!-- no further -->
  <line x1="385" y1="110" x2="520" y2="110" stroke="#22c55e" stroke-width="3"/>
  <text class="note" x="410" y="100">no further stimulation</text>
  <text class="note" x="10" y="176">Leaving the buffer zone stops the sound and resets the count.</text>
</svg>
